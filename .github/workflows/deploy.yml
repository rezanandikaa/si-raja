name: 🚀 Build & Deploy Production

on:
  # trigger manual dari GitHub Actions tab
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Test
  # ─────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, gd, pdo_mysql, zip, exif
          tools: composer:v2

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: ⚙️ Setup .env untuk testing
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: 🧪 Jalankan tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
        run: php artisan test --parallel

  # ─────────────────────────────────────────
  # JOB 2: Build assets (Composer + Vite)
  # ─────────────────────────────────────────
  build:
    needs: test
    name: 🔨 Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout kode
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, gd, pdo_mysql, zip, exif
          tools: composer:v2

      - name: 📦 Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: 🔧 Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm ci

      - name: ⚡ Build assets dengan Vite
        run: npm run build

      - name: 📁 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            .
            !.git
            !node_modules
            !tests
            !.env
            !.env.*
            !docker
            !docker-compose.yml
            !sail
            !.agents
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 3: Deploy ke VPS via SSH
  # ─────────────────────────────────────────
  deploy:
    name: 🚀 Deploy ke Production
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./release

      - name: 🔑 Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🛡️ Tambah server ke known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Sync file ke server via rsync
        run: |
          rsync -azP \
            --delete \
            --exclude='.env' \
            --exclude='storage/app/public' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            ./release/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: ⚙️ Jalankan post-deploy commands di server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "🔧 Maintenance mode ON..."
            php artisan down --retry=15 || true

            echo "📄 Copy .env jika belum ada..."
            [ -f .env ] || cp .env.example .env

            echo "🔑 Generate app key jika belum ada (skip jika sudah ada)..."
            php artisan key:generate --no-interaction --show | grep -q '^base64:' \
              && grep -q '^APP_KEY=base64:' .env \
              || php artisan key:generate --no-interaction

            echo "🔗 Symlink storage..."
            php artisan storage:link --no-interaction || true

            echo "🗃️ Jalankan migrasi database..."
            php artisan migrate --force --no-interaction

            echo "🧹 Clear & cache config untuk production..."
            php artisan optimize

            echo "🔁 Restart queue worker (jika ada)..."
            php artisan queue:restart || true

            echo "🚀 Maintenance mode OFF..."
            php artisan up

            echo "✅ Deploy selesai!"
